name: 'controller'
services:
  database:
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    image: postgres:18.3-alpine
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    network_mode: host
  application:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      CHATTERBOX_PORT: "${CHATTERBOX_PORT}"
      CHATTERBOX_REMOTE_PATH: "${CHATTERBOX_REMOTE_PATH}"
      CHATTERBOX_SYSTEM_MAC_ADDRESS: "${CHATTERBOX_SYSTEM_MAC_ADDRESS}"
      CONNECTION_INTERFACE: "${CONNECTION_INTERFACE}"
      CONNECTION_TYPE: "${CONNECTION_TYPE}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/${POSTGRES_DB}"
      DOMAIN: "${DOMAIN}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      SSH_HOSTNAME: "${SSH_HOSTNAME}"
      SSH_PORT: "${SSH_PORT}"
      SSH_PRIVATE_KEY: "${SSH_PRIVATE_KEY}"
      SSH_REMOTE_USER: "${SSH_REMOTE_USER}"
      WOL_ALIAS: "${WOL_ALIAS}"
    ports:
      - "4000:4000"
    network_mode: host