name: 'reverse-proxy'
services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - "${CADDY_CONF_DIR}:/etc/caddy:z"
      - "${CADDY_CONFIG_DIR}:/config:z"
      - "${CADDY_DATA_DIR}:/data:z"
    environment:
      DOMAIN: "${DOMAIN}"
      CONTROLLER_URI: "${CONTROLLER_URI}"
      PROXIED_URI: "${PROXIED_URI}"
      SSL_EMAIL: "${SSL_EMAIL}"
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
networks:
  bridge: