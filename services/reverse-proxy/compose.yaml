name: 'reverse-proxy'
services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: "${DOMAIN}"
      CONTROLLER_URI: "${CONTROLLER_URI}"
      PROXIED_URI: "${PROXIED_URI}"
      SSL_EMAIL: "${SSL_EMAIL}"

volumes:
  caddy_data:
  caddy_config: